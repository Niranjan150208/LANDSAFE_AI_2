services:
  - type: web
    name: landsafe-ai-2
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
    disk:
      name: landsafe-data
      mountPath: /var/data
      sizeGB: 1
